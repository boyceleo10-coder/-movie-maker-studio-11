<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Movie Maker Studio</title><style>body{margin:0;background:#101114;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:24px 18px 10px;position:sticky;top:0;background:#101114}h1{margin:0}nav{display:flex;gap:8px;overflow:auto;padding:10px}button{border:0;border-radius:12px;padding:12px 15px;background:#252831;color:#fff}button.active,.primary{background:#7657ff}.screen{display:none;padding:16px;max-width:800px;margin:auto}.screen.active{display:block}.card{background:#1b1e25;border:1px solid #30343e;border-radius:18px;padding:16px;margin:12px 0}textarea,input,select{width:100%;box-sizing:border-box;background:#111217;color:#fff;border:1px solid #343844;border-radius:12px;padding:12px;margin:6px 0 12px;font:inherit}textarea{min-height:180px}.idea,.item{border:1px solid #30343e;border-radius:14px;padding:14px;margin:10px 0}.muted{color:#aeb2bd}.row{display:flex;gap:8px}.row>*{flex:1}</style></head><body><header><h1>🎬 Movie Maker Studio</h1><div class="muted">Your free movie-making toolbox</div></header><nav><button class="active" onclick="show('home',this)">Home</button><button onclick="show('ideas',this)">Ideas</button><button onclick="show('script',this)">Script</button><button onclick="show('shots',this)">Shots</button><button onclick="show('check',this)">Checklist</button><button onclick="show('vfx',this)">VFX</button></nav><section id="home" class="screen active"><div class="card"><h2>Start your movie</h2><p class="muted">Plan your story, scenes and shots in one place.</p><button class="primary" onclick="go('ideas')">Get an idea</button> <button onclick="go('script')">Write script</button></div><div class="card"><h3>🎥 Built for your setup</h3><p class="muted">Solo actor • iPad • tripod • green screen • simple lights</p></div></section><section id="ideas" class="screen"><h2>🎬 Movie ideas</h2><div id="ideasList"></div></section><section id="script" class="screen"><div class="card"><h2>📝 Script writer</h2><input id="title" placeholder="Movie title"><textarea id="scriptText" placeholder="INT. BEDROOM - NIGHT

Write your scene here..."></textarea><button class="primary" onclick="saveScript()">Save</button> <button onclick="loadScript()">Load</button></div></section><section id="shots" class="screen"><div class="card"><h2>🎥 Shot list</h2><div class="row"><select id="type"><option>Wide shot</option><option>Medium shot</option><option>Close-up</option><option>Extreme close-up</option><option>Low angle</option><option>High angle</option></select><input id="scene" placeholder="Scene/action"></div><button class="primary" onclick="addShot()">Add shot</button><div id="shotList"></div></div></section><section id="check" class="screen"><div class="card"><h2>✅ Filming checklist</h2><div id="checks"></div></div></section><script>const ideas=[['The Portal','A strange portal appears in your room and every trip through it changes the world.'],['The Last Message','A message from your future self gives you one night to solve a mystery.'],['The Clone','You notice another version of yourself appearing in the background of your recordings.'],['The Glitch','Your room changes every time you look away.'],['Superpower','You wake up with a strange power and must learn to control it.']];const checks=['Charge iPad','Clean camera lens','Set up tripod','Set up green screen','Check lighting','Avoid shadows','Lock focus/exposure','Record test clip','Record each shot twice','Back up footage'];function show(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}function go(id){show(id);document.querySelectorAll('nav button').forEach(b=>{if(b.textContent.toLowerCase().includes(id))b.classList.add('active')})}document.getElementById('ideasList').innerHTML=ideas.map((x,i)=>`<div class="idea" onclick="pick(${i})"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join('');function pick(i){title.value=ideas[i][0];scriptText.value='FADE IN:

INT. BEDROOM - NIGHT

'+ideas[i][1]+'

CUT TO:';go('script')}function saveScript(){localStorage.movieTitle=title.value;localStorage.movieScript=scriptText.value;alert('Saved on this iPad.')}function loadScript(){title.value=localStorage.movieTitle||'';scriptText.value=localStorage.movieScript||''}function addShot(){let a=JSON.parse(localStorage.shots||'[]');a.push({t:type.value,s:scene.value||'Untitled shot'});localStorage.shots=JSON.stringify(a);scene.value='';render()}function removeShot(i){let a=JSON.parse(localStorage.shots||'[]');a.splice(i,1);localStorage.shots=JSON.stringify(a);render()}function render(){let a=JSON.parse(localStorage.shots||'[]');shotList.innerHTML=a.length?a.map((x,i)=>`<div class="item"><button onclick="removeShot(${i})">×</button><b>${x.t}</b><br><span class="muted">${x.s}</span></div>`).join(''):'<p class="muted">No shots yet.</p>'}checks.forEach((x,i)=>{checksEl=document.getElementById('checks');checksEl.innerHTML+=`<label class="item" style="display:block"><input style="width:auto" type="checkbox" onchange="localStorage.c${i}=this.checked"> ${x}</label>`});render();
const vfx=[
["⚡ Lightning","Film yourself reacting to a flash. Add a lightning overlay or effect during editing. Keep the camera locked for easier compositing."],
["🌀 Teleport","Record a clean background plate, then record yourself in the starting and ending positions. Cut between the clips and add a flash/glow."],
["💥 Explosion","Film your reaction with a locked camera. Add a non-graphic explosion effect behind or beside you during editing."],
["🦸 Superpower","Record the action twice: once normally and once with your movement exaggerated. Add glow, energy or particle effects in the edit."],
["👻 Ghost","Lock the camera, record a clean plate, then record yourself moving slowly. Lower opacity and blend the clips for a ghost effect."],
["🌌 Portal","Film yourself looking toward an empty area. Add a portal background/overlay and match the lighting on your face to the portal."],
["🟩 Green Screen","Light the screen evenly, stay a little away from it, avoid green clothing, and use a chroma-key tool to replace the background."]
];
document.getElementById("vfxList").innerHTML=vfx.map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join("");
</script></body></html>
